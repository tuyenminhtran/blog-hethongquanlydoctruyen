<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi Tiết Bài Viết | StoryReader Blog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="min-h-screen bg-slate-950 flex flex-col justify-between">
  <!-- Navbar -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5">
        <span class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-book-open"></i>
        </span>
        <div>
          <span class="font-bold text-lg text-white tracking-tight">StoryReader <span class="text-indigo-400">Blog</span></span>
          <span class="block text-[10px] text-slate-400 uppercase tracking-widest -mt-1">Hệ Thống Quản Lý Đọc Truyện</span>
        </div>
      </a>
      <div id="authNav"></div>
    </div>
  </header>

  <!-- Post Detail Content -->
  <main class="max-w-4xl mx-auto px-4 py-10 flex-grow w-full">
    <!-- Post Article Card -->
    <article id="postArticle" class="glass-card rounded-2xl overflow-hidden shadow-2xl relative p-6 md:p-8">
      <div class="text-center py-12 text-slate-400">
        <i class="fa-solid fa-spinner fa-spin text-2xl text-indigo-400 mb-3"></i>
        <p>Đang tải nội dung bài viết...</p>
      </div>
    </article>

    <!-- Comments Section (Sprint 1 Requirement: Issue #4 - Add comment function) -->
    <section class="glass-card rounded-2xl p-6 md:p-8 shadow-2xl mt-8">
      <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-6">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-comments text-indigo-400"></i>
          Thảo Luận & Bình Luận (<span id="commentsCount">0</span>)
        </h2>
        <span class="text-xs text-slate-400">Cộng đồng người đọc StoryReader</span>
      </div>

      <!-- Add Comment Form -->
      <form id="commentForm" class="mb-8">
        <div class="flex items-start gap-3">
          <img id="myCommentAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="w-10 h-10 rounded-full object-cover border border-slate-700 flex-shrink-0" alt="me">
          <div class="flex-grow space-y-3">
            <textarea id="commentContent" rows="3" required class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Viết bình luận, chia sẻ cảm nghĩ của bạn về bài viết này..."></textarea>
            <div class="flex items-center justify-between">
              <span class="text-[11px] text-slate-500">Hãy giữ bình luận lịch sự và văn minh.</span>
              <button type="submit" id="btnSubmitComment" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs transition shadow-md shadow-indigo-600/30 flex items-center gap-1.5">
                <i class="fa-solid fa-paper-plane"></i> Gửi Bình Luận
              </button>
            </div>
          </div>
        </div>
      </form>

      <!-- Comments List -->
      <div id="commentsList" class="space-y-4">
        <!-- Rendered dynamically -->
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-500">
    <p>© 2014 - 2026 StoryReader Blog. Bài thực hành số 3 - Quản lý dự án với GitHub.</p>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id') || 'post_001';

    async function loadPostDetail() {
      try {
        const res = await fetch(`${API_BASE}/posts/${postId}`);
        const data = await res.json();
        if (!data.success) {
          document.getElementById('postArticle').innerHTML = `
            <div class="text-center py-12 text-slate-400">
              <p class="text-rose-400 font-semibold mb-2">Không tìm thấy bài viết.</p>
              <a href="/" class="text-xs text-indigo-400 hover:underline">Quay về trang chủ</a>
            </div>
          `;
          return;
        }

        const post = data.post;
        document.title = `${post.title} | StoryReader Blog`;

        // Render article
        document.getElementById('postArticle').innerHTML = `
          <div class="flex items-center gap-2 text-xs text-indigo-400 font-semibold uppercase tracking-wider mb-3">
            <span class="px-2.5 py-1 rounded-md bg-indigo-500/10 border border-indigo-500/30">${post.category}</span>
            <span>•</span>
            <span class="text-slate-400"><i class="fa-regular fa-calendar"></i> ${new Date(post.createdAt).toLocaleDateString('vi-VN')}</span>
            <span>•</span>
            <span class="text-slate-400"><i class="fa-regular fa-eye"></i> ${post.views} lượt xem</span>
          </div>

          <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight leading-snug">
            ${post.title}
          </h1>

          <div class="flex items-center gap-3 my-6 pb-6 border-b border-slate-800">
            <img src="${post.author?.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150'}" class="w-10 h-10 rounded-full object-cover border border-slate-700" alt="avatar">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-sm font-semibold text-white">${post.author?.fullName || 'Tác giả'}</span>
                <span class="text-[10px] px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-300 font-semibold uppercase">${post.author?.role || 'Member'}</span>
              </div>
              <p class="text-xs text-slate-400">Thành viên Ban biên tập StoryReader</p>
            </div>
          </div>

          <div class="rounded-2xl overflow-hidden mb-6 max-h-96">
            <img src="${post.cover}" alt="${post.title}" class="w-full h-full object-cover">
          </div>

          <div class="text-sm md:text-base text-slate-300 leading-relaxed space-y-4 whitespace-pre-line font-light">
            ${post.content}
          </div>

          <div class="flex flex-wrap gap-2 pt-6 mt-6 border-t border-slate-800">
            <span class="text-xs text-slate-500 flex items-center gap-1"><i class="fa-solid fa-tags"></i> Thẻ:</span>
            ${(post.tags || []).map(t => `<span class="text-xs px-2.5 py-1 rounded-lg bg-slate-800/80 text-slate-300 border border-slate-700">#${t}</span>`).join('')}
          </div>
        `;

        // Render comments
        renderComments(data.comments || []);
      } catch (err) {
        console.error(err);
      }
    }

    function renderComments(comments) {
      document.getElementById('commentsCount').innerText = comments.length;
      const list = document.getElementById('commentsList');

      if (comments.length === 0) {
        list.innerHTML = `
          <div class="text-center py-6 text-slate-500 text-xs">
            Chưa có bình luận nào. Hãy là người đầu tiên để lại ý kiến!
          </div>
        `;
        return;
      }

      list.innerHTML = comments.map(c => `
        <div class="p-4 rounded-xl bg-slate-900/60 border border-slate-800/80 flex items-start gap-3">
          <img src="${c.author?.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150'}" class="w-8 h-8 rounded-full object-cover border border-slate-700 flex-shrink-0" alt="avatar">
          <div class="flex-grow">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="text-xs font-semibold text-slate-200">${c.author?.fullName || 'Độc giả'}</span>
                <span class="text-[9px] px-1.5 py-0.2 rounded bg-indigo-500/20 text-indigo-300 font-semibold">${c.author?.role || 'Member'}</span>
              </div>
              <span class="text-[10px] text-slate-500">${new Date(c.createdAt).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })} - ${new Date(c.createdAt).toLocaleDateString('vi-VN')}</span>
            </div>
            <p class="text-xs text-slate-300 mt-1.5 leading-relaxed">${c.content}</p>
            <div class="flex items-center gap-4 mt-2.5 text-[11px] text-slate-400">
              <button onclick="likeComment('${c.id}')" class="hover:text-rose-400 transition flex items-center gap-1">
                <i class="fa-regular fa-heart"></i> <span id="like_${c.id}">${c.likes || 0}</span> Thích
              </button>
              <button onclick="replyComment('${c.author?.fullName}')" class="hover:text-indigo-400 transition flex items-center gap-1">
                <i class="fa-solid fa-reply"></i> Trả lời
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function likeComment(cmtId) {
      try {
        const res = await fetch(`${API_BASE}/comments/${cmtId}/like`, { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          const el = document.getElementById(`like_${cmtId}`);
          if (el) el.innerText = data.likes;
        }
      } catch (err) {
        console.error(err);
      }
    }

    function replyComment(authorName) {
      const input = document.getElementById('commentContent');
      input.value = `@${authorName}: `;
      input.focus();
    }

    // Submit new comment
    document.getElementById('commentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = document.getElementById('commentContent').value.trim();
      const user = Auth.getUser();
      const btn = document.getElementById('btnSubmitComment');

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang gửi...';

      try {
        const res = await fetch(`${API_BASE}/posts/${postId}/comments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            content,
            author: user ? {
              id: user.id,
              fullName: user.fullName || user.username,
              avatar: user.avatar,
              role: user.role
            } : undefined
          })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          document.getElementById('commentContent').value = '';
          showToast('Đã thêm bình luận thành công!', 'success');
          loadPostDetail();
        } else {
          showToast(data.message || 'Lỗi khi gửi bình luận.', 'error');
        }
      } catch (err) {
        showToast('Lỗi kết nối máy chủ!', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Gửi Bình Luận';
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      const user = Auth.getUser();
      if (user && user.avatar) {
        const av = document.getElementById('myCommentAvatar');
        if (av) av.src = user.avatar;
      }
      loadPostDetail();
    });
  </script>
</body>
</html>
