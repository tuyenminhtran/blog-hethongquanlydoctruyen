<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Tài Khoản | StoryReader Blog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="min-h-screen bg-slate-950 flex flex-col justify-between">
  <!-- Navbar -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5">
        <span class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-book-open"></i>
        </span>
        <div>
          <span class="font-bold text-lg text-white tracking-tight">StoryReader <span class="text-indigo-400">Blog</span></span>
          <span class="block text-[10px] text-slate-400 uppercase tracking-widest -mt-1">Hệ Thống Quản Lý Đọc Truyện</span>
        </div>
      </a>
      <div id="authNav"></div>
    </div>
  </header>

  <!-- Register Section -->
  <main class="flex-grow flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md glass-card rounded-2xl p-8 shadow-2xl relative overflow-hidden">
      <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-violet-500/20 rounded-full blur-3xl pointer-events-none"></div>

      <div class="text-center mb-6">
        <span class="inline-block p-3 rounded-full bg-indigo-600/20 text-indigo-400 mb-3 text-lg">
          <i class="fa-solid fa-user-plus"></i>
        </span>
        <h1 class="text-2xl font-bold text-white">Tạo tài khoản mới</h1>
        <p class="text-sm text-slate-400 mt-1">Tham gia cộng đồng đọc và đánh giá truyện hàng đầu</p>
      </div>

      <!-- Social Register (Sprint 1 Requirement: Allow user register by email or via facebook, linkedin) -->
      <div class="grid grid-cols-2 gap-3 mb-6">
        <button id="btnFbRegister" type="button" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-[#1877F2]/10 hover:bg-[#1877F2]/20 text-[#1877F2] border border-[#1877F2]/30 text-xs font-semibold transition">
          <i class="fa-brands fa-facebook text-base"></i> Facebook
        </button>
        <button id="btnLiRegister" type="button" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-[#0A66C2]/10 hover:bg-[#0A66C2]/20 text-[#0A66C2] border border-[#0A66C2]/30 text-xs font-semibold transition">
          <i class="fa-brands fa-linkedin text-base"></i> LinkedIn
        </button>
      </div>

      <div class="relative flex py-2 items-center mb-6">
        <div class="flex-grow border-t border-slate-800"></div>
        <span class="flex-shrink mx-3 text-xs text-slate-500 font-medium uppercase">Hoặc đăng ký bằng email</span>
        <div class="flex-grow border-t border-slate-800"></div>
      </div>

      <!-- Form Register by Email -->
      <form id="registerForm" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5" for="fullName">Họ và tên</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 text-xs">
              <i class="fa-solid fa-user"></i>
            </span>
            <input type="text" id="fullName" required class="glass-input w-full pl-9 pr-3.5 py-2.5 rounded-xl text-sm" placeholder="Nguyễn Văn A">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5" for="email">Địa chỉ Email</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 text-xs">
              <i class="fa-solid fa-envelope"></i>
            </span>
            <input type="email" id="email" required class="glass-input w-full pl-9 pr-3.5 py-2.5 rounded-xl text-sm" placeholder="reader@example.com">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5" for="password">Mật khẩu</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 text-xs">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" id="password" required minlength="6" class="glass-input w-full pl-9 pr-3.5 py-2.5 rounded-xl text-sm" placeholder="Ít nhất 6 ký tự">
          </div>
        </div>

        <div class="flex items-start text-xs text-slate-400 gap-2">
          <input type="checkbox" id="terms" required class="mt-0.5 rounded border-slate-700 bg-slate-900 text-indigo-600 focus:ring-0">
          <label for="terms">Tôi đồng ý với các <a href="#" class="text-indigo-400 hover:underline">Điều khoản dịch vụ</a> và <a href="#" class="text-indigo-400 hover:underline">Chính sách bảo mật</a>.</label>
        </div>

        <button type="submit" id="btnSubmit" class="w-full py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Đăng Ký Tài Khoản
        </button>
      </form>

      <p class="text-center text-xs text-slate-400 mt-6">
        Đã có tài khoản? 
        <a href="/login.html" class="text-indigo-400 hover:text-indigo-300 font-semibold ml-1">Đăng nhập ngay</a>
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-500">
    <p>© 2014 - 2026 StoryReader Blog. Bài thực hành số 3 - Quản lý dự án với GitHub.</p>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    // Handle Register by Email
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnSubmit');

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang đăng ký...';

      try {
        const res = await fetch(`${API_BASE}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullName, email, password, provider: 'email' })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          Auth.setUser(data.user, data.token);
          showToast('Đăng ký tài khoản thành công! Đang chuyển hướng...', 'success');
          setTimeout(() => { window.location.href = '/'; }, 1500);
        } else {
          showToast(data.message || 'Đăng ký thất bại.', 'error');
        }
      } catch (err) {
        showToast('Lỗi kết nối máy chủ!', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Đăng Ký Tài Khoản';
      }
    });

    // Handle Register via Facebook
    document.getElementById('btnFbRegister').addEventListener('click', async () => {
      const email = prompt('Nhập email tài khoản Facebook của bạn:', 'fb_user_' + Math.floor(Math.random()*1000) + '@facebook.com');
      if (!email) return;

      try {
        const res = await fetch(`${API_BASE}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            fullName: 'Facebook User (' + email.split('@')[0] + ')', 
            email, 
            provider: 'facebook',
            providerId: 'fb_' + Date.now() 
          })
        });
        const data = await res.json();
        if (data.success) {
          Auth.setUser(data.user, data.token);
          showToast('Đăng ký thành công bằng Facebook!', 'success');
          setTimeout(() => { window.location.href = '/'; }, 1200);
        } else {
          showToast(data.message || 'Đăng ký Facebook thất bại.', 'error');
        }
      } catch (err) {
        showToast('Lỗi kết nối!', 'error');
      }
    });

    // Handle Register via LinkedIn
    document.getElementById('btnLiRegister').addEventListener('click', async () => {
      const email = prompt('Nhập email tài khoản LinkedIn của bạn:', 'li_user_' + Math.floor(Math.random()*1000) + '@linkedin.com');
      if (!email) return;

      try {
        const res = await fetch(`${API_BASE}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            fullName: 'LinkedIn Professional (' + email.split('@')[0] + ')', 
            email, 
            provider: 'linkedin',
            providerId: 'li_' + Date.now() 
          })
        });
        const data = await res.json();
        if (data.success) {
          Auth.setUser(data.user, data.token);
          showToast('Đăng ký thành công bằng LinkedIn!', 'success');
          setTimeout(() => { window.location.href = '/'; }, 1200);
        } else {
          showToast(data.message || 'Đăng ký LinkedIn thất bại.', 'error');
        }
      } catch (err) {
        showToast('Lỗi kết nối!', 'error');
      }
    });
  </script>
</body>
</html>
